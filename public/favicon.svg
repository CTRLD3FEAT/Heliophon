<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring representing Earth's magnetosphere -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.3"/>
  <!-- Solar body with gradient -->
  <circle cx="50" cy="50" r="32" fill="url(#sunGradient)" filter="url(#glow)"/>
  <!-- CME flare burst -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="50" y1="8" x2="50" y2="4"/>
    <line x1="50" y1="92" x2="50" y2="96"/>
    <line x1="8" y1="50" x2="4" y2="50"/>
    <line x1="92" y1="50" x2="96" y2="50"/>
    <line x1="18" y1="18" x2="12" y2="12"/>
    <line x1="82" y1="82" x2="88" y2="88"/>
    <line x1="18" y1="82" x2="12" y2="88"/>
    <line x1="82" y1="18" x2="88" y2="12"/>
  </g>
  <!-- Sound wave arcs representing sonification -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 50 70 Q 65 65 70 60" />
    <path d="M 50 73 Q 68 65 76 58" />
    <path d="M 50 76 Q 71 65 82 56" />
  </g>
</svg>